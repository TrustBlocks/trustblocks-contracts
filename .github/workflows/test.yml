name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # XTDB 2.1 runs on Java 21 to 24 (bin/clj pins 21 locally).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: DeLaGuardo/setup-clojure@13
        with:
          cli: latest

      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ hashFiles('deps.edn') }}
          restore-keys: deps-

      # Same as bin/clj -M:dev:run test. The suite starts in-memory XTDB nodes,
      # so it needs no services.
      - name: test
        run: clojure -M:dev:run test
